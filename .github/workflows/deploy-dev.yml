  workflow_dispatch:
  push:
    branches:
      - 'dev'

permissions:
  id-token: write
  contents: read
  packages: write

env:
  ROLE: arn:aws:iam::273081097050:role/deployer
  REGION: eu-west-1
  CLUSTER: daystar-dev
  NAMESPACE: customerportal
  VALUES: values.dev.yaml # make sure to name it according to the naming convention of your helm values that corresponds to the dev deployment values 
