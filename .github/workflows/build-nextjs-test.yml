name: Build Next.js test image (manual, no deploy)

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  ROLE: arn:aws:iam::273081097050:role/deployer
  REGION: eu-west-1
  REGISTRY: 273081097050.dkr.ecr.eu-west-1.amazonaws.com/customer-portal-web
  DOCKERFILE_PATH: Dockerfile

jobs:
  Build:
    name: Build and push (no deploy step)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Setup - Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Container - Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Container - Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Container - Meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}
          tags: |
            type=sha,format=short

      - name: Setup - AWS login
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE }}
          aws-region: ${{ env.REGION }}

      - name: Setup - ECR login
        id: login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Container - Build & Push
        uses: docker/build-push-action@v5
        with:
          push: true
          context: .
          file: ${{ env.DOCKERFILE_PATH }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          build-args: |
            NEXT_PUBLIC_ENV=development
