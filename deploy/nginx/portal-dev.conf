# HTTP-only for now — DNS for portal-dev.daystar-power.com isn't live yet,
# so certbot can't issue a cert. Once DNS resolves to this server, run:
#   sudo certbot --nginx -d portal-dev.daystar-power.com
# which will rewrite this file for HTTPS + redirect automatically.

server {
    server_name portal-dev.daystar-power.com;

    # Report/Excel import-export goes through multer — default 1m is too small.
    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/portal-dev.daystar-power.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/portal-dev.daystar-power.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = portal-dev.daystar-power.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name portal-dev.daystar-power.com;
    return 404; # managed by Certbot


}